services:
  postgres:
    image: postgres:15-alpine
    container_name: mecash_db
    environment:
      POSTGRES_USER: mecash
      POSTGRES_PASSWORD: mecash_secret
      POSTGRES_DB: mecash
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mecash']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
